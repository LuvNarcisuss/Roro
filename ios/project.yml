name: Roro
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.roro.photography
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    SWIFT_OBJC_BRIDGING_HEADER: Roro/Roro-Bridging-Header.h
    OTHER_LDFLAGS: $(inherited) -ObjC
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Roro:
    type: application
    platform: iOS
    sources:
      - path: Roro
        excludes:
          - AppResources
      - path: Roro/AppResources
        type: folder
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: Roro/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Package local photo pages
        script: |
          set -e
          /bin/sh "$SRCROOT/../node_modules/react-native/scripts/xcode/with-environment.sh" "$SRCROOT/../scripts/package-web.sh"
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Bundle React Native shell
        script: |
          set -e
          export FORCE_BUNDLING=1
          WITH_ENVIRONMENT="$SRCROOT/../node_modules/react-native/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$SRCROOT/../node_modules/react-native/scripts/react-native-xcode.sh"
          /bin/sh -c "\"$WITH_ENVIRONMENT\" \"$REACT_NATIVE_XCODE\""
        basedOnDependencyAnalysis: false
schemes:
  Roro:
    build:
      targets:
        Roro: all
    run:
      config: Debug
    archive:
      config: Release
