name: Roro
fileGroups:
  - Configuration/RoroCredits.storekit
options:
  deploymentTarget:
    iOS: '16.0'
  createIntermediateGroups: true
  schemePathPrefix: "../"
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    TARGETED_DEVICE_FAMILY: '1'
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.roro.photography
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: '3'
    COMPRESS_PNG_FILES: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  SwiftASN1:
    url: https://github.com/apple/swift-asn1.git
    exactVersion: 1.5.1
targets:
  Roro:
    type: application
    platform: iOS
    dependencies:
      - package: SwiftASN1
    sources:
      - path: Roro
      - path: ../Assets/icons/roro-logo.png
        buildPhase: resources
      - path: ../Assets/artwork-manifest.json
        buildPhase: resources
      - path: ../Configuration
        type: folder
        buildPhase: resources
      - path: ../Assets/backgrounds
        type: folder
        buildPhase: resources
      - path: ../Assets/icons
        type: folder
        buildPhase: resources
      - path: ../Assets/photos
        type: folder
        buildPhase: resources
      - path: ../Assets/videos
        type: folder
        buildPhase: resources
      - path: ../Assets/community
        type: folder
        buildPhase: resources
      - path: ../Assets/fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        INFOPLIST_FILE: Roro/Info.plist
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Roro:
    build:
      targets:
        Roro: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/RoroCredits.storekit
    archive:
      config: Release
